# squid-mobile — proxy INTERNE dédié à notre propre scraping par la sortie 4G.
#
# Pourquoi il existe : notre resi-proxy (Node) porte l'authentification par clé, le
# comptage par client et la sélection de sortie — c'est lui qui fait la facturation, il
# reste le chemin des CLIENTS. Mais il ne tient pas une page à ~100 connexions parallèles
# (Google Maps expirait à 90 s à travers lui). squid encaisse cette concurrence.
#
# Ce proxy-ci n'écoute QUE sur la boucle locale et ne sert QUE nos scrapers : aucune
# authentification, donc il ne doit jamais être exposé. La sortie 4G est obtenue par
# tcp_outgoing_address : pf route ensuite cette IP source par l'interface du modem.
#
# ⚠️ L'IP ci-dessous suit le bail DHCP du modem : elle est réécrite automatiquement par
# resi-proxy/sync-squid.sh quand exits.json change.

http_port 127.0.0.1:3130
tcp_outgoing_address 192.168.1.146

# Accès : boucle locale uniquement
acl localhost_only src 127.0.0.1/32
http_access allow localhost_only
http_access deny all

# CONNECT limité au HTTPS standard (même politique que le proxy client)
acl SSL_ports port 443
acl Safe_ports port 80 443 8080 8443
acl CONNECT method CONNECT
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# On scrape : jamais de cache, on veut la page telle qu'elle est maintenant
cache deny all
cache_mem 8 MB
maximum_object_size 0 KB

# Concurrence : c'est la raison d'être de ce proxy
max_filedescriptors 4096
client_lifetime 5 minutes
half_closed_clients off
read_timeout 2 minutes
connect_timeout 30 seconds

# Discrétion : ne pas annoncer un proxy aux sites scrapés
via off
forwarded_for delete
httpd_suppress_version_string on

access_log none
cache_log /opt/homebrew/var/logs/squid-mobile.log
pid_filename /opt/homebrew/var/run/squid-mobile.pid
